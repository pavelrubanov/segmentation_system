name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # ── 1. Линтинг ────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff

      # Проверяем только синтаксические ошибки и неопределённые имена (F/E9).
      # Стилевые предупреждения пайплайн не блокируют.
      - name: Check for errors
        run: ruff check src/ tests/ classifier/ --select E9,F --output-format=github

  # ── 2. Тесты ──────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: segmentation_system

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: segmentation_system/tests/requirements.txt

      - name: Install dependencies (CPU torch + test deps)
        run: pip install -r tests/requirements.txt

      # Тесты, требующие mobile_sam (categorie 2) и реальных биолог-фикстур
      # (categorie 1, файлов на CI нет), скипаются автоматически:
      #   - test_biologist_metrics.py: пропустит из-за отсутствия jpg/масок
      #   - test_biologist_segmentation.py: EXPECTED пуст → @skipif сработает
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=src --cov=classifier --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: segmentation_system/coverage.xml
          fail_ci_if_error: false
